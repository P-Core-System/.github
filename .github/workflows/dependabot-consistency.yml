name: Dependabot consistency check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Dependabot configs across org repos
        uses: actions/github-script@v7
        with:
          script: |
            const owner = 'P-Core-System';
            const repo = context.repo.repo;
            const targets = ['pcore-trader', 'pcore-brain', 'pcore-assistant', 'pcore-webai', 'pcore-orchestra'];

            const { data: allRepos } = await github.rest.repos.listForOrg({ org: owner, per_page: 100 });
            const repos = allRepos.filter((r) => targets.includes(r.name));

            const missing = [];
            for (const r of repos) {
              try {
                await github.rest.repos.getContent({ owner, repo: r.name, path: '.github/dependabot.yml' });
              } catch (err) {
                if (err.status === 404) {
                  missing.push(r.name);
                } else {
                  throw err;
                }
              }
            }

            const date = new Date().toISOString().slice(0, 10);
            const title = `Dependabot config check — ${date}`;

            let body;
            if (missing.length > 0) {
              body = `Repos missing a \`.github/dependabot.yml\`:\n\n` +
                missing.map((n) => `- [ ] ${n}`).join('\n');
            } else {
              body = 'All repos have dependabot.yml ✓';
            }

            const prefix = 'Dependabot config check';
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = issues.find((i) => i.title.startsWith(prefix));

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, title, body });
              return `Updated existing issue #${existing.number}`;
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body });
              return `Created issue #${created.data.number}`;
            }