name: Reusable — Stale issue/PR cleanup

on:
  workflow_call:
    inputs:
      stale_issue_days:
        description: 'Days without activity before an issue is marked stale'
        required: false
        type: number
        default: 60
      stale_pr_days:
        description: 'Days without activity before a PR is marked stale'
        required: false
        type: number
        default: 21
      close_issue_days:
        description: 'Days after being marked stale before an issue is closed'
        required: false
        type: number
        default: 14
      close_pr_days:
        description: 'Days after being marked stale before a PR is closed'
        required: false
        type: number
        default: 14
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Stale issues and PRs
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: >
            This issue has been automatically marked as stale because it has had no recent
            activity. If it is still relevant, leave a comment to keep it open. It will be
            closed automatically if no further activity occurs.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has had no
            recent activity. If it is still in progress, leave a comment to keep it open.
            It will be closed automatically if no further activity occurs.
          close-issue-message: >
            This issue has been automatically closed due to inactivity.
          close-pr-message: >
            This pull request has been automatically closed due to inactivity.
          days-before-issue-stale: ${{ inputs.stale_issue_days }}
          days-before-pr-stale: ${{ inputs.stale_pr_days }}
          days-before-issue-close: ${{ inputs.close_issue_days }}
          days-before-pr-close: ${{ inputs.close_pr_days }}
          stale-issue-label: 'stale'
          stale-pr-label: 'stale-pr'
          exempt-issue-labels: 'dependencies,security,pinned'
          exempt-pr-labels: 'dependencies,security,pinned'
          operations-per-run: 250